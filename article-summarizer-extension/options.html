<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Article Summarizer · Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 20px; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input, select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--soft); color: var(--fg); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 24px; }
    #saved { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <h1>Article Summarizer settings</h1>

  <label for="apiKey">Anthropic API key</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">
  <div class="hint">
    Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
    It's stored only in this browser's local extension storage and sent only to api.anthropic.com.
  </div>

  <label for="model">Model</label>
  <select id="model">
    <option value="claude-opus-5-5">Claude Opus 5.5 — best quality (default)</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 — faster, cheaper</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5 — fastest, cheapest</option>
  </select>

  <label for="length">Default summary length</label>
  <select id="length">
    <option value="short">Short — 3-5 bullets</option>
    <option value="medium">Medium — TL;DR + key points</option>
    <option value="detailed">Detailed — sections with headings</option>
  </select>

  <label for="language">Summary language</label>
  <input id="language" type="text" placeholder="Leave blank to match the article (e.g. English, Español)">

  <div class="row">
    <button id="save" class="primary" style="flex:0 0 auto">Save</button>
    <span id="saved" role="status"></span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
