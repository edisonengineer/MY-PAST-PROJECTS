# Weekly health check of both websites. If anything is broken (a page, image, script,
# 3D model or PDF that doesn't load, or the Google Sheet not answering), this run fails
# and GitHub emails you. Open the run to see the list. Warnings (files not uploaded
# yet, images without alt text) are listed but never fail the check.
# Run it any time: Actions -> Weekly site health check -> Run workflow.
name: Weekly site health check

on:
  schedule:
    - cron: '17 4 * * 1'      # Mondays 07:17 Nairobi time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Services site (and the Google Sheet)
        run: node tools/check-site.js https://edisonengineer.github.io/MY-PAST-PROJECTS/
      - name: Job portfolio
        if: always()
        run: node tools/check-site.js https://edisonengineer.github.io/ --portfolio
