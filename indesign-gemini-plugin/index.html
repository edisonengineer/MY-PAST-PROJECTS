<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="tabs">
      <div class="tab active" id="tabText" data-panel="textPanel">Text</div>
      <div class="tab" id="tabImage" data-panel="imagePanel">Image</div>
    </div>
    <div class="tab small" id="toggleSettings">Settings</div>
  </div>

  <!-- Settings -->
  <div class="card" id="settings">
    <label for="apiKey">Gemini API key</label>
    <input id="apiKey" type="password" placeholder="Paste key from aistudio.google.com" />
    <div class="row">
      <div class="col">
        <label for="model">Text model</label>
        <input id="model" type="text" value="gemini-3.8-flash" />
      </div>
      <div class="col">
        <label for="imageModel">Image model</label>
        <input id="imageModel" type="text" value="gemini-3.1-flash-image" />
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label for="speed">Speed</label>
        <select id="speed">
          <option value="minimal" selected>Fastest</option>
          <option value="low">Balanced</option>
          <option value="high">Best quality (slow)</option>
        </select>
      </div>
      <div class="col">
        <label for="temperature">Style</label>
        <select id="temperature">
          <option value="0.2">Precise</option>
          <option value="0.7" selected>Balanced</option>
          <option value="1.0">Creative</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button id="saveSettings" class="col">Save</button>
      <button id="testKey" class="col">Test connection</button>
    </div>
  </div>

  <p id="status"></p>

  <!-- Text -->
  <div id="textPanel">
    <div class="card">
      <label for="action">Action</label>
      <select id="action">
        <option value="generate" selected>Write new text</option>
        <option value="rewrite">Rewrite selection</option>
        <option value="shorten">Shorten selection</option>
        <option value="expand">Expand selection</option>
        <option value="proofread">Proofread selection</option>
        <option value="translate">Translate selection</option>
        <option value="headline">Headlines for selection</option>
      </select>
      <p id="actionHint" class="hint"></p>

      <label for="prompt">Instructions</label>
      <textarea id="prompt" placeholder="e.g. A 120-word intro for a brochure about solar water pumps, friendly tone"></textarea>
      <label class="inline"><input id="useSelection" type="checkbox" /> Use selected text as context</label>
      <button id="generate" class="primary">Generate text</button>
    </div>

    <div class="card">
      <label for="result">Result (edit before inserting)</label>
      <textarea id="result" class="tall"></textarea>
      <div class="row">
        <select id="insertMode" class="col">
          <option value="auto">Replace selection / at cursor</option>
          <option value="after">After selection</option>
          <option value="frame">New text frame</option>
        </select>
        <button id="insert" class="col">Insert</button>
      </div>
    </div>
  </div>

  <!-- Image -->
  <div id="imagePanel" class="hidden">
    <div class="card">
      <label for="imagePrompt">Describe the image</label>
      <textarea id="imagePrompt" placeholder="e.g. Photo of a solar water pump in a green Kenyan farm at sunrise, wide shot"></textarea>
      <label for="aspect">Shape</label>
      <select id="aspect">
        <option value="auto">Match selected frame</option>
        <option value="1:1">Square 1:1</option>
        <option value="4:3">Landscape 4:3</option>
        <option value="16:9">Wide 16:9</option>
        <option value="3:4">Portrait 3:4</option>
        <option value="9:16">Tall 9:16</option>
      </select>
      <button id="generateImage" class="primary">Generate image</button>
    </div>

    <div class="card">
      <label>Preview</label>
      <div id="previewBox"><span id="previewEmpty" class="hint">No image yet</span><img id="preview" class="hidden" /></div>
      <label class="inline"><input id="embedImage" type="checkbox" checked /> Embed in document (no separate link file)</label>
      <button id="placeImage">Place in selected frame / new frame</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
